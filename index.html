<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="media/favicon/favicon.ico">
    <link rel="stylesheet" href="style/style.css">
    <title>Calculator</title>
</head>
<body>
    <main class="container">
        <section class="calculator dark" aria-labelledby="calculator-heading">
            <h1 id="calculator-heading" class="visually-hidden">Calculator</h1>

            <button type="button" id="sci-toggle" class="mode-toggler" aria-pressed="false" aria-label="Toggle scientific mode">fx</button>
            <button type="button" class="theme-toggler active" aria-label="Toggle light and dark theme"></button>

            <output id="preview" aria-hidden="true"></output>
            <output id="display" aria-live="polite" aria-atomic="true"></output>

            <div class="buttons scientific-buttons" id="scientific-buttons" role="group" aria-label="Scientific functions" hidden>
                <button type="button" class="btn-operator" id="sci-shift" data-sci="shift" aria-pressed="false" aria-label="Shift">2nd</button>
                <button type="button" class="btn-operator" id="sci-angle" data-sci="angle" aria-label="Angle unit: degrees">Deg</button>
                <button type="button" class="btn-operator" data-sci="sqrt" aria-label="Square root">&radic;</button>
                <button type="button" class="btn-operator" data-sci="abs" aria-label="Absolute value">|x|</button>

                <button type="button" class="btn-operator" data-sci="sin" aria-label="Sine">sin</button>
                <button type="button" class="btn-operator" data-sci="cos" aria-label="Cosine">cos</button>
                <button type="button" class="btn-operator" data-sci="tan" aria-label="Tangent">tan</button>
                <button type="button" class="btn-operator" data-sci="pi" aria-label="Pi">&pi;</button>

                <button type="button" class="btn-operator" data-sci="ln" aria-label="Natural log">ln</button>
                <button type="button" class="btn-operator" data-sci="log" aria-label="Log base 10">log</button>
                <button type="button" class="btn-operator" data-sci="reciprocal" aria-label="Reciprocal">1/x</button>
                <button type="button" class="btn-operator" data-sci="econst" aria-label="Euler's number">e</button>

                <button type="button" class="btn-operator" data-sci="exp" aria-label="e to the x">e^x</button>
                <button type="button" class="btn-operator" data-sci="square" aria-label="x squared">x&sup2;</button>
                <button type="button" class="btn-operator" data-sci="power" aria-label="x to the y">x^y</button>
                <button type="button" class="btn-operator" data-sci="sign" aria-label="Toggle sign">+/-</button>
            </div>

            <div class="buttons" role="group" aria-label="Calculator keypad">
                <button type="button" class="btn-operator" data-operator="clear" id="clear" aria-label="Clear">C</button>
                <button type="button" class="btn-operator" data-operator="backspace" aria-label="Backspace">&#9003;</button>
                <button type="button" class="btn-operator" data-operator="percentage" id="percentage" aria-label="Percent">&percnt;</button>
                <button type="button" class="btn-operator" data-operator="/" aria-label="Divide">&divide;</button>

                <button type="button" class="btn-number" id="7">7</button>
                <button type="button" class="btn-number" id="8">8</button>
                <button type="button" class="btn-number" id="9">9</button>
                <button type="button" class="btn-operator" data-operator="*" aria-label="Multiply">&times;</button>

                <button type="button" class="btn-number" id="4">4</button>
                <button type="button" class="btn-number" id="5">5</button>
                <button type="button" class="btn-number" id="6">6</button>
                <button type="button" class="btn-operator" id="-" data-operator="-" aria-label="Subtract">-</button>

                <button type="button" class="btn-number" id="1">1</button>
                <button type="button" class="btn-number" id="2">2</button>
                <button type="button" class="btn-number" id="3">3</button>
                <button type="button" class="btn-operator" id="+" data-operator="+" aria-label="Add">+</button>

                <button type="button" class="btn-operator" data-operator="()" id="()" aria-label="Parenthesis">()</button>
                <button type="button" class="btn-number" id="0">0</button>
                <button type="button" class="btn-operator" id="." aria-label="Decimal point">.</button>
                <button type="button" class="btn-operator btn-equal" data-operator="=" id="btn-equal" aria-label="Equals">=</button>
            </div>
        </section>
    </main>
    <script src="script/script.js"></script>
</body>
</html>
